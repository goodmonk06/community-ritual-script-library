version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ritual-scripts-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ritual_user
      POSTGRES_PASSWORD: ritual_password
      POSTGRES_DB: ritual_scripts_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ritual_user -d ritual_scripts_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_dev:
